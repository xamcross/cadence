server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/cadence}
  application:
    name: cadence-backend
  servlet:
    multipart:
      # F03 logo upload. Cap at 2 MB so the in-service 1 MB validateLogo gate is the authoritative
      # limit and a >1 MB file still reaches the handler to be refused with a clean 400 (FR-012).
      max-file-size: 2MB
      max-request-size: 2MB
  security:
    oauth2:
      client:
        registration:
          cadence-oidc:
            client-id: ${OIDC_CLIENT_ID:dev-client}
            client-secret: ${OIDC_CLIENT_SECRET:dev-secret}
            scope: openid,email,profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          cadence-oidc:
            # Explicit endpoints (NOT issuer-uri): issuer-uri triggers an eager OIDC discovery
            # fetch at startup, which crashes the whole context when the IdP is unreachable (local
            # dev / tests). Explicit URIs are stored without any startup network call; jwk-set-uri
            # is fetched lazily only when an ID token is actually validated. Defaults target a local
            # Keycloak realm; override per environment via the OIDC_* env vars.
            authorization-uri: ${OIDC_AUTH_URI:http://localhost:8088/realms/cadence/protocol/openid-connect/auth}
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8088/realms/cadence/protocol/openid-connect/token}
            jwk-set-uri: ${OIDC_JWK_URI:http://localhost:8088/realms/cadence/protocol/openid-connect/certs}
            user-info-uri: ${OIDC_USERINFO_URI:http://localhost:8088/realms/cadence/protocol/openid-connect/userinfo}
            user-name-attribute: sub

# F01 Authentication & Session Management. Secrets (keys/peppers) come from Fly secrets
# in prod; the *-dev defaults below are for local development ONLY and MUST NOT be used in prod
# (AuthSecretsValidator fails fast on the prod profile if a real value is absent).
auth:
  spa-base-url: ${SPA_BASE_URL:http://localhost:4200}
  session:
    cookie-name: cad_session
    absolute-ttl: PT8H
    idle-ttl: PT30M
    clock-skew: PT60S
    secret: ${JWT_SECRET:dev-insecure-jwt-signing-key-change-me-0123456789abcdef}
    previous-secret: ${JWT_SECRET_PREVIOUS:}
  lockout:
    max-attempts: 5
    window: PT15M
  invitation:
    ttl: PT72H
  password-reset:
    ttl: PT1H
  rbac:
    # Bounded refusal-audit throttle: at most one AUTHORIZATION_DENIED audit per (member,event)
    # per window, so repeated probing cannot amplify audit volume (research D8 / FR-028).
    denied-audit-window: PT1M
  crypto:
    pii-key: ${PII_ENC_KEY:dev-insecure-pii-aes-key-change-me-0123456789abcdef0123}
    pii-pepper: ${PII_PEPPER:dev-insecure-pii-pepper-change-me}
    token-pepper: ${TOKEN_PEPPER:dev-insecure-token-pepper-change-me}
    ip-pepper: ${IP_PEPPER:dev-insecure-ip-pepper-change-me}

# F01.1 Calendar OAuth Token Store. Explicit endpoint URIs (NOT issuer-uri — the F01 eager-discovery
# footgun). Client secrets come from Fly secrets in prod; the dev defaults are placeholders only.
# Scopes (constitution VIII): Google = least-privilege calendar.events.owned + calendar.freebusy (F10 D1);
# Microsoft = openid profile email offline_access Calendars.ReadWrite (F11 D1) — write needs ReadWrite
# (Graph has no owned-events-only delegated scope), and openid/profile/email yield the id_token whose
# email/UPN is the mailbox address getSchedule requires. getSchedule no-content is enforced by adapter
# parse-discipline (start/end/status only) + a non-circular test, NOT a structural field projection.
calendar:
  oauth:
    redirect-base-url: ${CALENDAR_REDIRECT_BASE_URL:http://localhost:8080}
    state-ttl: PT10M
    access-token-skew: PT60S
    connect-timeout: PT5S
    read-timeout: PT10S
    max-refresh-retries: 3
    refresh-retry-backoff: PT0.05S
    google:
      client-id: ${GOOGLE_CAL_CLIENT_ID:dev-google-client}
      client-secret: ${GOOGLE_CAL_CLIENT_SECRET:dev-google-secret}
      authorization-uri: ${GOOGLE_CAL_AUTH_URI:https://accounts.google.com/o/oauth2/v2/auth}
      token-uri: ${GOOGLE_CAL_TOKEN_URI:https://oauth2.googleapis.com/token}
      revocation-uri: ${GOOGLE_CAL_REVOKE_URI:https://oauth2.googleapis.com/revoke}
      # F10 (research D1): event WRITE requires more than free/busy. Least-privilege = manage only
      # events Cadence creates (calendar.events.owned) + free/busy read. calendar.events (read/write of
      # ALL events) is the documented fallback only, with a re-recorded §VIII trade-off. Space-separated.
      scope: ${GOOGLE_CAL_SCOPE:https://www.googleapis.com/auth/calendar.events.owned https://www.googleapis.com/auth/calendar.freebusy}
    microsoft:
      client-id: ${MS_CAL_CLIENT_ID:dev-ms-client}
      client-secret: ${MS_CAL_CLIENT_SECRET:dev-ms-secret}
      authorization-uri: ${MS_CAL_AUTH_URI:https://login.microsoftonline.com/common/oauth2/v2.0/authorize}
      token-uri: ${MS_CAL_TOKEN_URI:https://login.microsoftonline.com/common/oauth2/v2.0/token}
      revocation-uri: ${MS_CAL_REVOKE_URI:}
      # F11 (research D1): event WRITE needs Calendars.ReadWrite (Graph has no owned-events-only delegated
      # scope, so this is broader than F10's Google grant; §VIII justification in the F11 plan). openid/
      # profile/email make Graph issue an id_token so providerAccountId holds the member SMTP/UPN that
      # getSchedule needs (D2a). Space-separated.
      scope: ${MS_CAL_SCOPE:openid profile email offline_access Calendars.ReadWrite}
  # F10 Google Calendar adapter (research D4/D8/D11). google.base-url points at real Google in prod and
  # at the in-test JDK HttpServer stub via @DynamicPropertySource. Retry = exp backoff + jitter, max 3.
  api:
    google:
      base-url: ${GOOGLE_CAL_API_BASE:https://www.googleapis.com}
    microsoft:
      base-url: ${MS_GRAPH_API_BASE:https://graph.microsoft.com}   # F11; tests point at the JDK HttpServer stub
    connect-timeout: PT5S
    read-timeout: PT10S
    max-retries: 3
    retry-base-backoff: PT0.1S
    freebusy-parallelism: 8
    max-window: P60D
    preview-window: P7D
    graph-availability-view-interval: 15   # F11 getSchedule availabilityViewInterval (min); exact bounds come from scheduleItems

# F12 Interview Template & Rule Engine. default-slot-cadence-minutes is the cadence used when a
# template sets none (D3); the per-template caps bound a single template so a huge pool + max window
# cannot amplify the availability fan-out into a DoS / mass-probe (FR-024/D8). The compute-window
# clamp reuses calendar.api.max-window (no new key).
interview:
  template:
    default-slot-cadence-minutes: 15
    max-members: 25
    max-pools: 10
    max-blackouts: 50

# F21 Email Template Library. Bounds on a single template so authoring content cannot exhaust storage
# nor amplify render-time substitution work (FR-020/D11); empty subject/body is rejected at save.
email:
  template:
    max-subject-length: 200
    max-body-length: 10000
    max-tokens-per-template: 50
    max-variants-per-type: 20

# F22 Email Delivery Channel (research D1/D2/D4/D5). The app-level default SMTP relay (host/port/
# username + the API-key-as-password) sends member/operational mail (invites/resets/system-alert) and
# is the candidate-send fallback when a workspace has no F03 email config. Fly secret NAMES are
# UPPER_SNAKE_CASE (dotted/lowercase property paths are NOT valid secret names). CADENCE_EMAIL_SMTP_PASSWORD
# MUST be set or the F01 member-email path breaks on first deploy. CADENCE_EMAIL_WEBHOOK_SECRET gates the
# inbound provider bounce webhook (never persisted to Mongo, never logged). No secrets inline.
# Invariant: reaper-threshold > smtp.read-timeout + max-backoff (so the reaper never races a live claim).
cadence:
  email:
    smtp:
      host: ${CADENCE_EMAIL_SMTP_HOST:localhost}
      port: ${CADENCE_EMAIL_SMTP_PORT:587}
      username: ${CADENCE_EMAIL_SMTP_USERNAME:}
      password: ${CADENCE_EMAIL_SMTP_PASSWORD:}
    webhook-secret: ${CADENCE_EMAIL_WEBHOOK_SECRET:}
    ops-alert-address: ${CADENCE_EMAIL_OPS_ALERT_ADDRESS:ops@localhost}
    retry-max-attempts: 3
    retry-base-backoff: PT30S
    reaper-threshold: PT10M
    sweep-batch-limit: 100
    read-timeout: PT10S
    # Fixed delays for the standalone @Scheduled workers (read directly by @Scheduled, not bound properties).
    reaper-fixed-delay: PT1M
    sweep-fixed-delay: PT30S
  scheduling:
    token-ttl: PT72H
    search-window-days: 10
    reaper-threshold: PT10M
    reaper-sweep-batch-limit: 200
    rate-limit-per-minute: 10
    spa-schedule-base-path: /schedule
    # F20 reschedule/cancel (Flow A3).
    spa-booking-base-path: /booking
    reschedule-cap: 3
    self-service-lead-time: PT0S
    # Fixed delay for the SchedulingReaper @Scheduled worker (read directly by @Scheduled).
    reaper-interval-ms: 60000

# Spring Mail / JavaMailSender app-level default transport (the SmtpMailTransport builds per-workspace
# senders from these defaults + the F03 credential — see MailConfig). STARTTLS on submission port 587.
spring.mail:
  host: ${CADENCE_EMAIL_SMTP_HOST:localhost}
  port: ${CADENCE_EMAIL_SMTP_PORT:587}
  username: ${CADENCE_EMAIL_SMTP_USERNAME:}
  password: ${CADENCE_EMAIL_SMTP_PASSWORD:}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    mongo:
      enabled: true

mongock:
  migration-scan-package: com.cadence.config.migration
