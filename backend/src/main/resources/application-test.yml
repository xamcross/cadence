management:
  server:
    port: 18081

# F22 test overrides. The RecordingMailTransport (@Primary test bean) replaces the SMTP transport, so the
# dummy host is never dialled. Zero backoff + a short reaper threshold keep the dispatch/reaper tests fast
# and deterministic (the crash window is driven by the test clock, not wall-clock sleeps). Fixed webhook
# secret so the bounce-webhook signature tests are reproducible.
cadence:
  email:
    smtp:
      host: dummy-smtp.invalid
      port: 587
      username: test
      password: test
    webhook-secret: test-webhook-secret-f22
    ops-alert-address: ops@cadence.test
    retry-base-backoff: PT0S
    reaper-threshold: PT2S
    read-timeout: PT1S
    # Park the background @Scheduled fires far out so the deterministic tests drive sweep()/reap() directly
    # (no wall-clock race between a background tick and the test's clock-advanced assertions).
    reaper-fixed-delay: PT1H
    sweep-fixed-delay: PT1H
  scheduling:
    token-ttl: PT72H
    search-window-days: 10
    reaper-threshold: PT2S
    reaper-sweep-batch-limit: 50
    rate-limit-per-minute: 5
    # Park the SchedulingReaper background fire far out; tests drive sweep() directly via the test clock.
    reaper-interval-ms: 3600000
  # F42 test overrides. Small limits + fast TTL for deterministic tests; the background sweep is parked far out
  # so tests drive CsvImportScheduler.sweep() directly (the expiresAt/updatedAt are stamped into the past, not
  # wall-clock slept — the F23 lesson).
  import:
    max-file-size: 64KB
    max-row-count: 200
    max-field-length: 4096
    reject-ratio: 0.80
    sweep-fixed-delay: PT1H
    sweep-batch-limit: 20
    job-ttl: PT2S
    processing-threshold: PT3S
  # F70 test overrides. Tighter caps so the per-source and per-workspace flood ceilings are reachable in a
  # deterministic test; default workspace fixed to the test workspace id.
  interest:
    default-workspace-id: ws1
    retention-fallback-days: 180
    max-per-ip-per-window: 3
    ip-window: PT10M
    max-per-workspace-per-window: 5
    workspace-window: PT1H
    min-fill-millis: 1500
  billing:
    product-id: "1001"
    team-plan-id: "2002"
    api-bearer: test-billing-bearer
    webhook-secret: test-billing-webhook-secret
    retry-base-backoff: PT0S
