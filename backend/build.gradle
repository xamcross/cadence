plugins {
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
}

group = 'com.cadence'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    mongockVersion = '5.4.4'
    // Override Spring Boot 3.3.5 managed version (1.19.8) — 1.20.x has Docker Desktop Windows fixes
    set('testcontainers.version', '1.20.6')
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    // OIDC SSO login (F01). First-party Spring starter — provides oauth2Login (authorization-code
    // + PKCE) and, transitively via spring-security-oauth2-jose, the Nimbus JwtEncoder/JwtDecoder
    // used to sign/verify the self-issued session JWT. No separate JWT library (plan C4).
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    // Bean Validation for request DTOs (@Valid). Spring-managed starter.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // F22 Email Delivery. Provides JavaMailSender for transactional email transmission (constitution
    // §III Spring Mail); no provider SDK added — the transport is wrapped behind EmailSender/MailTransport
    // so the provider is swappable by bean replacement (research D1).
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Mongock — idempotent, versioned MongoDB migration runner
    // Correct artifact ID: mongodb-springdata-v4-driver (NOT mongock-mongodb-springdata-v4)
    implementation "io.mongock:mongock-springboot-v3:${mongockVersion}"
    implementation "io.mongock:mongodb-springdata-v4-driver:${mongockVersion}"

    // Structured JSON logging — BOM does not manage this; pin version explicitly
    // Use 9.0 for Spring Boot 3.3+; use 8.0 for Spring Boot 3.1–3.2
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

    // F42 CSV import — RFC-4180-safe parsing of untrusted candidate files (plan C4 Dependency-Policy
    // justification: a parsing library, NOT an infrastructure SDK and NOT a stack substitution).
    implementation 'org.apache.commons:commons-csv:1.11.0'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // spring-boot-testcontainers is NOT included in starter-test; required for @ServiceConnection
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:mongodb'
    testImplementation 'org.testcontainers:junit-jupiter'
    // Spring Security test support — oidcLogin()/csrf() request post-processors (BOM-managed)
    testImplementation 'org.springframework.security:spring-security-test'
    // (No WireMock: F01.1 stubs the OAuth provider token/revoke endpoints with a tiny JDK
    // com.sun.net.httpserver.HttpServer in-test — zero extra dependency, and avoids the
    // wiremock-standalone fat-jar Jackson/Jetty classpath conflicts with Spring Boot.)
    // Gradle 9 no longer injects junit-platform-launcher automatically
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Docker Desktop on Windows requires API >= 1.40, but docker-java (via Testcontainers)
    // defaults to API 1.32 and rejects with "client version 1.32 is too old".
    // docker-java reads the JVM system property `api.version` (NOT the DOCKER_API_VERSION
    // env var, which only the Go CLI honours), so pin it here.
    systemProperty 'api.version', '1.41'
    environment 'DOCKER_HOST', 'npipe:////./pipe/docker_engine'
}

// Disable the plain JAR to prevent wildcard copy ambiguity in Dockerfile
jar { enabled = false }

// Fixed artifact name for deterministic Dockerfile COPY
bootJar { archiveFileName = 'cadence-backend.jar' }
