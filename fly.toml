app = "cadence"
primary_region = "iad"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false

  [[http_service.checks]]
    grace_period = "60s"
    interval = "10s"
    method = "GET"
    path = "/actuator/health"
    timeout = "5s"
    port = 8081

[build]
  dockerfile = "backend/Dockerfile"
  build-context = "backend"

kill_timeout = "35s"

[env]
  SERVER_PORT = "8080"
  MANAGEMENT_SERVER_PORT = "8081"
  SPRING_PROFILES_ACTIVE = "production"
