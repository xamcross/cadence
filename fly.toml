app = "cadence--mlohw"
# fra: co-located with the Atlas cluster (AWS eu-central-1, Frankfurt) since 2026-07-31 —
# the machine was moved out of ams during the 032 launch incident.
primary_region = "fra"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false

# Health check on the isolated management port (8081). This MUST be a top-level [checks] entry,
# NOT [[http_service.checks]]: per the Fly.io fly.toml reference, http_service checks have no
# `port` field and only probe internal_port (8080), where the actuator endpoints are not served
# (they would return 403). Top-level checks require an explicit `port` and gate machine health.
[checks]
  [checks.health]
    type = "http"
    port = 8081
    method = "get"
    path = "/actuator/health"
    interval = "10s"
    timeout = "5s"
    # 600s: cold start on Atlas M0 across regions takes 80s+ normally (Spring context + Mongock),
    # and MINUTES under degraded ams<->Atlas networking (2026-07-31: ~1-20s driver RTTs). A grace
    # shorter than the worst-case boot turns any slow window into a self-inflicted restart loop:
    # the check kills the app mid-boot, forever. Keep this comfortably above worst observed boot.
    grace_period = "600s"

[build]
  # Build context is the project root (Fly default). `build-context` is NOT a valid fly.toml
  # key, so the Dockerfile COPY paths are written relative to the repo root (backend/...).
  dockerfile = "backend/Dockerfile"

kill_timeout = "35s"

[env]
  SERVER_PORT = "8080"
  MANAGEMENT_SERVER_PORT = "8081"
  SPRING_PROFILES_ACTIVE = "prod"
