# fly.toml app configuration file generated for cadence on 2026-06-13T19:01:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cadence'
primary_region = 'ams'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  MANAGEMENT_SERVER_PORT = '8081'
  SERVER_PORT = '8080'
  SPRING_PROFILES_ACTIVE = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false

[checks]
  [checks.health]
    port = 8081
    type = 'http'
    interval = '10s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'get'
    path = '/actuator/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
